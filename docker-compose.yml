services:
  tuesday:
    image: ${TUESDAY_IMAGE:-tuesday:local}
    build: .
    container_name: tuesday
    ports:
      - "${TUESDAY_PORT:-7002}:8080"
    volumes:
      - tuesday_data:/app/data
    environment:
      - TUESDAY_BASE_URL=${TUESDAY_BASE_URL:-http://localhost:7002}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:7002}
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  tuesday_data:
